default: &default
  base_uri: "http://priora.local:3000"
  certificates_path: "storage/certificates_banksalt"
  tpp_client:
    app_id: "app_id"
    app_secret: "app_secret"
  tpp_verifier:
    app_id: "wirecard_test_id"
    app_secret: "wirecard_test_secret"

live: &live
  <<: *default
  base_uri: "http://priora.saltedge.com"
  certificates_path: "storage/certificates_prod"

test: &test
  <<: *default
  base_uri: "http://priora.banksalt.com"
  certificates_path: "storage/certificates_banksalt"

local: &local
  <<: *default

# ---

development:
  <<: *test

test:
  <<: *local

production:
  <<: *live
